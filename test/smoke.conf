lua_shared_dict healthcheck 1m;
lua_package_path '/usr/local/lua/crowdsec/?.lua;;';

init_by_lua_block {
	for _, m in ipairs({"cjson", "bit", "ffi", "ngx.ssl", "resty.http", "resty.openssl",
			"resty.lrucache", "resty.string", "resty.upstream.healthcheck"}) do
		require(m)
	end
}

upstream smoke_backend {
	server 127.0.0.1:8081;
}

init_worker_by_lua_block {
	local hc = require "resty.upstream.healthcheck"
	local upstream = require "ngx.upstream"
	for _, u in ipairs(upstream.get_upstreams()) do
		local ok, err = hc.spawn_checker{
			shm = "healthcheck", upstream = u, type = "http",
			http_req = "GET / HTTP/1.0\r\nHost: " .. u .. "\r\n\r\n",
			interval = 1000, timeout = 1000, fall = 3, rise = 2,
		}
		if not ok then
			ngx.log(ngx.ERR, "healthcheck spawn failed: ", err)
		end
	end
}

server {
	listen 8081;
	location / {
		content_by_lua_block {
			ngx.say("lua ok ", require("cjson").encode({nginx = ngx.config.nginx_version}))
		}
	}
}

server {
	listen 80;
	http2 on;
	location / {
		proxy_pass http://smoke_backend;
	}
	location = /status {
		content_by_lua_block {
			ngx.print(require("resty.upstream.healthcheck").status_page())
		}
	}
}
